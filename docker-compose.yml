services:
  charter-mark-app:
    build: .
    container_name: charter-mark-govtech
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/charter_mark.db
    volumes:
      - ./data:/app/data
